name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang only, and not by preference: gcc 13 segfaults compiling a module
      # that uses std::string, and gcc 14 ICEs on this code with or without
      # debug info. The Makefile refuses gcc by version with that explanation.
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev qt6-base-dev libsecret-1-dev libssl-dev

      - name: Show the toolchain the build settled on
        run: make CXX=clang++ print-config

      # STRICT=1 is -Werror. It lives here rather than in the default build so
      # that a compiler newer than this commit inventing a new warning breaks CI
      # rather than someone's first plugin start.
      - name: Build and test with warnings as errors
        run: make CXX=clang++ STRICT=1 all test

      - name: The agent answers without a keyring or a token
        run: |
          set -x
          ./build/slack-agent | grep -q '"ok":false'
          ./build/slack-agent credentials | grep -q '"ok":true'
          printf '<html><head><meta property="og:title" content="ci"></head></html>' \
            | ./build/slack-agent parse-html https://example.com/ | grep -q '"title":"ci"'
          # A pasted loopback URL must never be fetched.
          ./build/slack-agent unfurl http://127.0.0.1:1/x | grep -q '"unfurls":{}'

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang, not gcc: gcc 14 ICEs compiling a module unit with -fsanitize
      # (cp/module.cc:9455). The Makefile refuses that combination outright.
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev qt6-base-dev libsecret-1-dev libssl-dev

      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make CXX=clang++ STRICT=1 SANITIZE=1 test

  fuzz:
    name: fuzz the parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libFuzzer ships with clang. This is the pass that actually earns its
      # runtime: the parser's entire input is bytes chosen by whoever owns the
      # page behind a pasted link, and every bug found in it so far was found
      # here rather than by anyone writing a test case.
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev qt6-base-dev libsecret-1-dev libssl-dev

      - name: Fuzz for two minutes over the checked-in corpus
        run: make CXX=clang++ fuzz FUZZ_TIME=120

      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: crash-*
          if-no-files-found: ignore

  qml:
    name: qml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt QML tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      # A parse gate, not a lint: qmllint cannot resolve Noctalia's qs.Commons
      # and qs.Widgets modules, so it would report nothing but unresolved
      # imports. This catches the errors that would otherwise only show up as a
      # blank sidebar at runtime.
      - name: Parse every QML file
        run: make QMLFORMAT=/usr/lib/qt6/bin/qmlformat qml

  plugin:
    name: manifest and entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every setting the pane saves has a manifest default
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          manifest = json.load(open("manifest.json"))
          defaults = manifest["metadata"]["defaultSettings"]

          # A setting Settings.qml writes with no default in the manifest reads
          # back as undefined on a fresh install.
          saved = set(re.findall(r"pluginApi\.pluginSettings\.(\w+)\s*=", open("Settings.qml").read()))
          missing = sorted(saved - set(defaults))
          if missing:
              sys.exit("Settings.qml saves keys with no manifest default: " + ", ".join(missing))

          for role, path in manifest["entryPoints"].items():
              if not os.path.exists(path):
                  sys.exit(f"entryPoints.{role} points at a missing file: {path}")

          # The scripts are gone; nothing may reach for them again.
          for qml in ["Main.qml", "Settings.qml", "Panel.qml", "BarWidget.qml"]:
              body = open(qml).read()
              for dead in ["slack.sh", "oauth-login.py"]:
                  if dead in body:
                      sys.exit(f"{qml} still refers to {dead}, which no longer exists")

          print(f"{len(defaults)} defaults, {len(manifest['entryPoints'])} entry points, all present")
          PY
