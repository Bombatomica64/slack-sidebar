name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang only, and not by preference: gcc 13 segfaults compiling a module
      # that uses std::string, and gcc 14 ICEs on this code with or without
      # debug info. The build refuses gcc by version with that explanation.
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev cmake ninja-build \
            qt6-base-dev libsecret-1-dev libssl-dev libsqlcipher-dev

      - name: Show the toolchain the build settled on
        run: make CXX=clang++ print-config

      # STRICT=1 is -Werror. It lives here rather than in the default build so
      # that a compiler newer than this commit inventing a new warning breaks CI
      # rather than someone's first plugin start.
      - name: Build and test with warnings as errors
        run: make CXX=clang++ STRICT=1 all test

      - name: The agent answers without a keyring or a token
        run: |
          set -x
          ./build/slack-agent | grep -q '"ok":false'
          ./build/slack-agent credentials | grep -q '"ok":true'
          printf '<html><head><meta property="og:title" content="ci"></head></html>' \
            | ./build/slack-agent parse-html https://example.com/ | grep -q '"title":"ci"'
          # A pasted loopback URL must never be fetched.
          ./build/slack-agent unfurl http://127.0.0.1:1/x | grep -q '"unfurls":{}'

  gcc-modules-probe:
    name: newest gcc (probe, non-blocking)
    runs-on: ubuntu-latest
    # Never gates a merge, and never goes red. gcc cannot build this today -
    # 13 segfaults, 14 and 16 hit internal compiler errors on modules against Qt
    # - and CMakeLists.txt refuses it for that reason. This job answers one
    # question on every push: has the newest gcc fixed it? A "no" is a result,
    # not a failure, so the verdict goes in the run summary and the job exits 0.
    #
    # gcc:latest rather than a pinned major, because a pinned one goes stale
    # silently - this job was written against 15 and was already a release
    # behind. The version it actually got is reported with the verdict.
    continue-on-error: true
    # The official gcc image, rather than apt on the runner. Ubuntu 24.04 has no
    # gcc newer than 14, and `apt-get install g++-15` does not fail on a missing
    # package: apt falls back to treating the name as a regex, which matches
    # clang-15 and flang-15 and reports success, so an apt-based probe installs
    # the wrong compiler and then finds no g++.
    container:
      image: gcc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the newest gcc and record the verdict
        run: |
          verdict=setup-failed
          detail=
          version=unknown
          if apt-get update -qq \
             && apt-get install -y --no-install-recommends \
                  make cmake ninja-build pkg-config \
                  qt6-base-dev libsecret-1-dev libssl-dev libsqlcipher-dev; then
            version="$(g++ -dumpfullversion 2>/dev/null || echo unknown)"
            # ALLOW_GCC=1 lifts the build's own gate, so a failure here is
            # gcc's and not ours. STRICT stays off: a compiler this much newer
            # inventing a new warning is not what is being measured.
            if make CXX=g++ ALLOW_GCC=1 all test >gcc15.log 2>&1; then
              verdict=builds
            else
              verdict=fails
              detail="$(grep -m3 -E 'internal compiler error|error:' gcc15.log || tail -20 gcc15.log)"
            fi
          fi

          {
            case "$verdict" in
              builds)
                echo "### gcc $version builds this :tada:"
                echo
                echo "The clang-only gate in CMakeLists.txt can go: drop the"
                echo '`SLACK_ALLOW_GCC` check and restore a gcc entry in `native`.'
                ;;
              fails)
                echo "### gcc $version still cannot build this"
                echo
                echo "The build stays clang-only. First failure:"
                echo
                echo '```'
                echo "$detail"
                echo '```'
                ;;
              *)
                echo "### newest-gcc probe: not run"
                echo
                echo "The toolchain or the Qt/libsecret/OpenSSL headers could not"
                echo "be installed in the gcc:15 container, so the question is"
                echo "still open. The build stays clang-only."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          echo "verdict: $verdict (gcc $version)"
          # Also to the job log, not just the summary: reading it should not
          # require downloading an artifact or opening another tab.
          [ -n "$detail" ] && printf '%s\n' "$detail"
          # A "no" is the answer, not a failure.
          exit 0

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-probe-build-log
          path: gcc15.log
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang, not gcc: gcc 14 ICEs compiling a module unit with -fsanitize
      # (cp/module.cc:9455). The build refuses that combination outright.
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev cmake ninja-build \
            qt6-base-dev libsecret-1-dev libssl-dev libsqlcipher-dev

      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make CXX=clang++ STRICT=1 SANITIZE=1 test

  fuzz:
    name: fuzz the parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libFuzzer ships with clang. This is the pass that actually earns its
      # runtime: the parser's entire input is bytes chosen by whoever owns the
      # page behind a pasted link, and every bug found in it so far was found
      # here rather than by anyone writing a test case.
      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev cmake ninja-build \
            qt6-base-dev libsecret-1-dev libssl-dev libsqlcipher-dev

      - name: Fuzz for two minutes over the checked-in corpus
        run: make CXX=clang++ fuzz FUZZ_TIME=120

      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: crash-*
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang llvm libclang-rt-dev cmake ninja-build \
            qt6-base-dev libsecret-1-dev libssl-dev libsqlcipher-dev

      # Not a gate. Nothing here fails for a low number: the point is to make
      # visible which parts of the agent the tests do not reach, so that gap is
      # a decision rather than a surprise.
      - name: Measure coverage
        run: |
          make CXX=clang++ coverage | tee coverage.txt

      - name: Put the table in the run summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the line-by-line report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/cov/html
          if-no-files-found: ignore

  luau:
    name: luau syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin is Luau since v5, and Luau is not packaged on the runner, so
      # the gate comes from the upstream release zip - one download, no
      # toolchain. It replaces the qmlformat pass that used to guard the QML
      # entry points, for the same reason: a syntax error in an entry point is
      # otherwise invisible until the shell quietly declines to load the plugin.
      - name: Install the Luau toolchain
        run: |
          curl -fsSL -o luau.zip \
            https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau-compile"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      # luau-compile, not luau-analyze. The shell injects `noctalia`, `ui`,
      # `panel` and `widget` as globals and calls `onOpen`/`update`/`onClick`
      # itself, so analyze without a definitions file reports nothing but
      # unknown globals and unused functions. --null parses and compiles every
      # file and discards the bytecode, which is the real syntax gate.
      - name: Parse and compile every Luau file
        run: make luau

  plugin:
    name: plugin.toml and entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The v5 equivalent of the old manifest.json check. plugin.toml is the
      # only place a setting gets a default and a label, and translations/en.json
      # the only place a tr() key resolves, so a key that exists in one and not
      # the other is a setting that reads back nil or a label that renders as
      # its own key - both of which only show up at runtime, in the panel.
      - name: Settings, entry points and translations agree
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib

          manifest = tomllib.load(open("plugin.toml", "rb"))
          translations = json.load(open("translations/en.json"))

          def flatten(node, prefix=""):
              for key, value in node.items():
                  path = f"{prefix}{key}"
                  if isinstance(value, dict):
                      yield from flatten(value, path + ".")
                  else:
                      yield path

          tr_keys = set(flatten(translations))
          problems = []

          # Every setting the manifest declares, from both the plugin-level [[setting]]
          # blocks and the per-widget [[widget.setting]] ones.
          declared = {s["key"] for s in manifest.get("setting", [])}
          for widget in manifest.get("widget", []):
              declared |= {s["key"] for s in widget.get("setting", [])}

          # Entry points. A missing one is a plugin that loads as an empty shell.
          entries = []
          for section in ("widget", "panel", "service"):
              for block in manifest.get(section, []):
                  entries.append((f"{section}.{block.get('id', '?')}", block["entry"]))
          for role, path in entries:
              if not os.path.exists(path):
                  problems.append(f"{role} points at a missing file: {path}")

          sources = sorted(f for f in os.listdir(".") if f.endswith(".luau"))
          bodies = {f: open(f).read() for f in sources}

          # Both getConfig and tr are reached directly and through one-line accessors
          # (`cfgInt(key, fallback)`, `tr(key, subst)`), so the accessors are found rather
          # than listed: a local function whose body passes its own first parameter
          # straight to the host call is one.
          def call_sites(body, host_call):
              escaped = host_call.replace(".", r"\.")
              names = {escaped}
              for match in re.finditer(r"local function (\w+)\((\w+)[^)]*\)(.*?)\nend", body, re.S):
                  fn, param, code = match.groups()
                  if re.search(rf"{escaped}\(\s*{param}\s*[,)]", code):
                      names.add(fn)
              for match in re.finditer(rf'(?:{"|".join(sorted(names))})\(\s*"([^"]+)"', body):
                  yield match.group(1)

          used = {}
          used_tr = {}
          for name, body in bodies.items():
              for key in call_sites(body, "noctalia.getConfig"):
                  used.setdefault(key, set()).add(name)
              for key in call_sites(body, "noctalia.tr"):
                  used_tr.setdefault(key, set()).add(name)

          for key in sorted(used):
              if key not in declared:
                  where = ", ".join(sorted(used[key]))
                  problems.append(f'getConfig("{key}") in {where} has no [[setting]] in plugin.toml')

          # Translations, in both directions: a tr() with no entry renders as the raw key,
          # and label_key/description_key are read by the shell's own settings pane.
          manifest_tr = set()
          def collect_keys(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key.endswith("_key") and isinstance(value, str):
                          manifest_tr.add(value)
                      else:
                          collect_keys(value)
              elif isinstance(node, list):
                  for item in node:
                      collect_keys(item)
          collect_keys(manifest)

          for key in sorted(used_tr):
              if key not in tr_keys:
                  problems.append(f'tr("{key}") in {", ".join(sorted(used_tr[key]))} is not in translations/en.json')
          for key in sorted(manifest_tr):
              if key not in tr_keys:
                  problems.append(f"plugin.toml references {key}, which is not in translations/en.json")

          # Unused translations are dead weight rather than a break, so they fail the job
          # only because letting them rot is how en.json stopped describing the plugin.
          orphans = sorted(tr_keys - set(used_tr) - manifest_tr)
          if orphans:
              problems.append("translations/en.json has keys nothing uses: " + ", ".join(orphans))

          # The v4 entry points and their helper scripts are gone; nothing may reach back.
          for name, body in bodies.items():
              for dead in ("slack.sh", "oauth-login.py", "manifest.json", "pluginApi.pluginSettings"):
                  if dead in body:
                      problems.append(f"{name} still refers to {dead}, which no longer exists")

          unused_settings = sorted(declared - set(used))
          if unused_settings:
              print("note: declared but never read: " + ", ".join(unused_settings))

          if problems:
              sys.exit("\n".join(problems))

          print(
              f"{len(declared)} settings, {len(entries)} entry points, "
              f"{len(tr_keys)} translation keys, all consistent"
          )
          PY
